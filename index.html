<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Collide</title>
  </head>
  <body class="h-screen grid place-items-center overflow-hidden">
    <svg width="0" height="0" class="absolute">
      <symbol id="i-gear" viewBox="0 0 24 24"><path d="M10.51 4.65L10.80 2.07L13.20 2.07L13.49 4.65L16.14 5.75L18.17 4.13L19.87 5.83L18.25 7.86L19.35 10.51L21.93 10.80L21.93 13.20L19.35 13.49L18.25 16.14L19.87 18.17L18.17 19.87L16.14 18.25L13.49 19.35L13.20 21.93L10.80 21.93L10.51 19.35L7.86 18.25L5.83 19.87L4.13 18.17L5.75 16.14L4.65 13.49L2.07 13.20L2.07 10.80L4.65 10.51L5.75 7.86L4.13 5.83L5.83 4.13L7.86 5.75Z"/><circle cx="12" cy="12" r="3.2"/></symbol>
      <symbol id="i-gh" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5M19 4v4h-4"/></symbol>
    </svg>
    <div id="game" data-state="title" class="relative overflow-hidden">
      <canvas id="c" class="absolute inset-0 w-full h-full"></canvas>

      <section id="title" class="absolute inset-0 flex flex-col items-center justify-center gap-[5cqw]">
        <h1>block collide</h1>
        <button id="start" class="btn">start game</button>
        <a href="https://github.com/sriv95/Block-Collide" target="_blank" rel="noopener" class="gh absolute bottom-[2cqw] left-1/2 -translate-x-1/2 flex items-center gap-[1cqw]"><svg><use href="#i-gh"/></svg>github.com/sriv95/Block-Collide</a>
      </section>

      <section id="select" hidden class="absolute inset-0 flex flex-col items-center justify-center gap-[3cqw]">
        <h2>select level</h2>
        <div id="tiles" class="grid grid-cols-10 gap-[1.2cqw] px-[8cqw] w-full"></div>
      </section>

      <section id="end" hidden class="absolute inset-0 flex flex-col items-center justify-center gap-[3cqw]">
        <h1>congratulations!</h1>
        <p id="done"></p>
        <button id="back" class="btn">back to level select</button>
      </section>

      <div id="lvl" hidden class="absolute top-0 left-1/2 pointer-events-none -translate-x-1/2 bg-black text-white font-bold tracking-wider px-[2cqw] py-[0.3cqw] text-[2cqw]"></div>

      <button id="gear" class="ico left-[2cqw]" aria-label="settings"><svg><use href="#i-gear"/></svg></button>
      <button id="restart" hidden class="ico right-[2cqw]" aria-label="restart"><svg><use href="#i-redo"/></svg></button>

      <section id="settings" hidden class="absolute inset-0 flex items-center justify-center bg-[#e9eef4]/90">
        <div class="flex flex-col items-center gap-[1.6cqw] w-[36cqw]">
          <h2>settings</h2>
          <button id="resume" class="btn w-full">resume</button>
          <button id="sr" class="btn w-full">restart</button>
          <button id="sq" class="btn w-full">back to level select</button>
        </div>
      </section>

    </div>
    <div id="fade" class="fixed inset-0 bg-black opacity-0 pointer-events-none"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
